name: Build Flet Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 檢出 GitHub 倉庫中的程式碼
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 設定 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 更新 pip 並安裝 Flet 框架工具
      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      # 4. 執行 Flet 標準打包指令
      # 採用你們之前試錯成功的 yes 管道語法，能完全點選同意所有自動拉取的 Gradle 與權限詢問
      - name: Build APK (Auto-yes for prompts)
        run: |
          yes | flet build apk

      # 5. 將打包生成的 APK 檔案上傳，並強制將產物命名為原本的主專案名稱
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: changba-app
          path: build/**/*.apk
