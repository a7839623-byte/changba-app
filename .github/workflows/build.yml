name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev python3-dev zip unzip openjdk-17-jdk aidl
        pip install --upgrade pip
        pip install buildozer cython

    - name: Pre-accept Android SDK Licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        # 初始化 Buildozer 目錄結構以取得 sdkmanager
        buildozer android debug || true
        # 強制同意所有 SDK 授權條款
        if [ -d "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin" ]; then
          yes | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
        fi

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug
      env:
        ACCEPT_BUILD_TOOLS_LICENSES: "1"
        BUILDOZER_ACCEPT_ALL_LICENSES: "1"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: bin/*.apk
